name: Compare i1 and i2 module loading metadata
on:
  push:
    branches: [analysis/integrated-controls]
    paths: [diagnostics/loader-audit.py, .github/workflows/loader-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Inspect original release modules without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 diagnostics/loader-audit.py
      - name: Publish text evidence only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "loader-audit-${GITHUB_SHA:0:12}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'i1/i2 模块加载静态对照' --notes '仅在GitHub托管macOS检查原始发布模块的加载元数据、签名、导入和启动上下文。没有加载执行模块，没有验证手机注入后的副本，不代表黑屏已修复。' out/loader-audit/*
