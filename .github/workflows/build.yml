name: Build FanProMAX iOS 17 TrollStore
on:
  push:
    branches: [main]
    paths: [apps/**, src/**, tests/**, scripts/**, .github/workflows/build.yml, README.md]
  workflow_dispatch:
    inputs:
      checked_run:
        description: Reuse an existing successful device/UI run
        required: false
        type: string
      checked_sha:
        description: Source SHA corresponding to checked_run
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.checked_run }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build, test and verify the device package
        run: bash scripts/build-on-github.sh
      - name: Stage checked package as draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${GITHUB_SHA:0:12}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'FanProMAX iOS 0.2.0 · 筛选与配置迁移' --notes '目标：iPhone 15 Pro Max / iOS 17.0 / TrollStore。提供独立显示、雷达、人机筛选、标记距离、筛选人数及显示配置导入导出。自瞄和压枪排除；不是APK全功能转换，其他写入类功能尚未移植。新应用身份下的实际读取与跨应用悬浮须设备验证。' out/FanProMAX-iOS.ipa out/package-report.json out/SHA256SUMS out/FanProMAX-README.zh-CN.md out/FanProMAX-ThirdPartyNotices.txt out/apk-features.json
  ui:
    if: ${{ !inputs.checked_run }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check real UIKit controls and layout
        run: |
          if test -d /Applications/Xcode_16.4.app/Contents/Developer; then
            export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          fi
          bash scripts/preview-external-ui.sh
      - name: Upload bounded UI reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fanpromax-ui-${{ github.sha }}
          path: out/FanProMAX-UI-preview.zip
          if-no-files-found: error
  publish:
    if: ${{ always() && ((needs.build.result == 'success' && needs.ui.result == 'success') || inputs.checked_run) }}
    needs: [build, ui]
    runs-on: macos-15-intel
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checked source and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ inputs.checked_sha || github.sha }}
          CHECKED_RUN: ${{ inputs.checked_run || github.run_id }}
        run: python3 scripts/publish-checked.py
