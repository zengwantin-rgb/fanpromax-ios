name: Build integrated movement and vehicle experiment
on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: 'Explicitly package and publish a device candidate after review'
        type: boolean
        default: false
  push:
    branches: [analysis/integrated-controls]
    paths: [apps/Integrated/**, tests/integrated_*.cpp, tests/diagnostic_*, diagnostics/receiver.py, scripts/*integrated*, .github/workflows/integrated-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test restoration and stale-object handling on hosted macOS
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p build out/integrated
          set -o pipefail
          for test_name in field flight motion speed_policy flight_motion; do
            xcrun clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -fsanitize=address,undefined -Iapps/Integrated "tests/integrated_${test_name}_tests.cpp" -o "build/integrated-${test_name}-tests"
            "build/integrated-${test_name}-tests" | tee "out/integrated/${test_name}-tests.txt"
          done
      - name: Test diagnostic receiver and authenticated uploader on hosted macOS
        run: |
          set -o pipefail
          python3 tests/diagnostic_receiver_tests.py
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fobjc-arc -fblocks -Iapps/Integrated apps/Integrated/DiagnosticUpload.mm tests/diagnostic_upload_tests.mm -framework Foundation -framework Security -o build/diagnostic-upload-tests
          build/diagnostic-upload-tests | tee out/integrated/diagnostic-upload-tests.txt
      - name: Test verified local ownership and controller pinning
        run: |
          set -o pipefail
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -UNDEBUG -fsanitize=address,undefined -Isrc -Iapps/Integrated src/PortCore.cpp apps/Integrated/CollisionProbe.cpp tests/integrated_context_tests.cpp -o build/integrated-context-tests
          build/integrated-context-tests | tee out/integrated/context-tests.txt
      - name: Download pinned original input
        env:
          GH_TOKEN: ${{ secrets.SOURCE_INPUT_TOKEN }}
        run: |
          mkdir -p input
          gh release download input-newstate-0.9.98-804 --repo zwthys-cyber/newstate-ios-port --pattern NEW_STATE_Decrypted.ipa --dir input
      - name: Validate profile, compile, sign and verify module
        run: |
          python3 -m venv build/integrated-venv
          build/integrated-venv/bin/python -m pip install --only-binary=:all: capstone==5.0.6 unicorn==2.1.4
          build/integrated-venv/bin/python scripts/integrated-profile.py input/NEW_STATE_Decrypted.ipa
          build/integrated-venv/bin/python diagnostics/speed-cap-emulation.py input/NEW_STATE_Decrypted.ipa
          module_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -arch arm64 -isysroot "$module_sdk" -miphoneos-version-min=17.0 -std=c++17 -O2 -Wall -Wextra -Werror -fobjc-arc -fblocks -fvisibility=hidden -Isrc -Iapps/Integrated -Ibuild -dynamiclib src/PortCore.cpp apps/Integrated/CollisionProbe.cpp apps/Integrated/Runtime.mm apps/Integrated/DiagnosticUpload.mm -framework UIKit -framework Foundation -framework Security -framework CoreGraphics -Wl,-dead_strip -Wl,-install_name,@executable_path/Frameworks/FanProIntegrated.dylib -o out/integrated/FanProIntegrated.dylib
          codesign --force --sign - --timestamp=none --pagesize 4096 out/integrated/FanProIntegrated.dylib
          codesign --verify --strict out/integrated/FanProIntegrated.dylib
      - name: Package explicitly requested candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate }}
        run: build/integrated-venv/bin/python scripts/package-integrated.py input/NEW_STATE_Decrypted.ipa out/integrated/FanProIntegrated.dylib
      - name: Remove original input
        if: always()
        run: rm -rf input build/integrated-package
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: integrated-checks-${{ github.sha }}
          path: |
            out/integrated/*-tests.txt
            out/integrated/profile-report.json
            out/integrated/speed-cap-emulation.json
          if-no-files-found: error
      - name: Stage verified game package as private draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "integrated-${GITHUB_SHA:0:12}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'FanProMAX 内置 i5.1 · 失败现场留存' --notes 'i5.1在i5自动回传基础上保留最近16次加速失败的原生前后读数及受指纹校验保护的最终曲线限速观测，避免失败后字段恢复与普通帧覆盖现场。此为诊断改进，移动与飞车控制策略未改变，实际三倍与稳定飞车未验证。不含自瞄、压枪或远程命令，公开包不含地址或密钥。' out/integrated/*
  ui:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check integrated UIKit controls
        run: |
          if test -d /Applications/Xcode_16.4.app/Contents/Developer; then export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer; fi
          bash scripts/integrated-ui.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: integrated-ui-${{ github.sha }}
          path: out/integrated-ui/
          if-no-files-found: error
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate }}
    needs: [build, ui]
    runs-on: macos-15-intel
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify reports and asset digest before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/integrated-publish.py
